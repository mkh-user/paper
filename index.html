<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>کاغذ</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
    type="text/css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      box-sizing: border-box;
      padding: 40px;
    }

    #editor {
      flex: 1;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: #1a1a1a;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 18px;
      line-height: 2;
      text-align: right;
      direction: rtl;
      unicode-bidi: plaintext;
      overflow-y: auto;
    }

    #editor::placeholder {
      color: #c0c0c0;
    }
  </style>
</head>

<body>
  <textarea id="editor" placeholder="اینجا بنویس..."></textarea>
</body>

</html>
